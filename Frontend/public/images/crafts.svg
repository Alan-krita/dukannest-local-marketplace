  <path d="M155 205 Q200 215 245 205" stroke="#FED7AA" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4,6" />
  <!-- Small Cup -->
  <path d="M260 210 L290 210 L285 245 L265 245 Z" fill="#0D9488" />
  <!-- Craft Corner Badge -->
  <rect x="135" y="30" width="130" height="32" rx="16" fill="#7C3AED" />
