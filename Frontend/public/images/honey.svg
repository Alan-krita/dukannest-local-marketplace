<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="honeyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#honeyBg)"/>
  <!-- Glass Honey Jar -->
  <rect x="140" y="100" width="120" height="135" rx="20" fill="url(#honeyGrad)" />
  <ellipse cx="200" cy="98" rx="60" ry="12" fill="#B45309" />
  <rect x="155" y="80" width="90" height="20" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="2" />
  <!-- Honey dipper / drips -->
  <ellipse cx="200" cy="155" rx="45" ry="25" fill="#FFFBEB" opacity="0.9" />
  <text x="200" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">RAW ORGANIC</text>
  <text x="200" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#B45309" text-anchor="middle">HONEY</text>
  <text x="200" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">100% Pure Wildflower Honey (500g)</text>
</svg>